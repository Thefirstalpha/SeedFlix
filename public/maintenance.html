  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1a0f2e, #3b1a5a);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
      font-feature-settings: normal;
      font-variation-settings: normal;
      font-weight: 900;
      font-size: 42px;
      margin: 0;
      letter-spacing: 2px;
    }

    .logo {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 20px;
      margin-bottom: 40px;
    }



    .logo-icon {
      margin-bottom: 0;
      width: 60px;
      height: 60px;
      background: #2b1547;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon span {
      font-size: 70px;
      font-weight: bold;
      color: #b57bff;
    }

    p {
      font-size: 20px;
      margin-top: 15px;
      opacity: 0.85;
    }

    .box {
      background: rgba(255, 255, 255, 0.05);
      padding: 30px 50px;
      border-radius: 15px;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }

    svg {
      display: block;
    }
  </style>

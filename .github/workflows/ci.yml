name: CI

on:
  push:
    branches:
      - "master"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-security:
    name: Build, Services, Security
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint (frontend + backend)
        run: npm run lint

      - name: Frontend build
        run: npm run build

      - name: Backend syntax checks
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsc --noEmit --skipLibCheck --incremental false server/*.ts
          ./node_modules/.bin/tsc --noEmit --skipLibCheck --incremental false server/**/*.ts
          ./node_modules/.bin/tsc --noEmit --skipLibCheck --incremental false common/*.ts

      - name: Unit & Integration tests (backend) with coverage
        run: npm run test:backend:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}



      - name: Service smoke test (server startup + API reachability)
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsx server/index.ts > /tmp/server.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for i in {1..25}; do
            if curl --silent --show-error --fail http://127.0.0.1:4000/api/health >/tmp/health.json; then
              break
            fi
            sleep 1
          done

          cat /tmp/server.log
          grep -q '"ok":true' /tmp/health.json

      - name: Dependency vulnerability audit (runtime)
        run: npm audit --omit=dev --audit-level=high

      - name: Build Docker image
        run: docker build --pull . --build-arg IMAGE_TAG=ci-${{ github.sha }} -t local/seedflix:ci

      - name: Trivy filesystem vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: latest
          scan-type: fs
          scan-ref: .
          hide-progress: true
          skip-dirs: node_modules,dist,.git
          trivy-config: trivy.yaml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Trivy Docker image vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: latest
          image-ref: local/seedflix:ci
          hide-progress: true
          trivy-config: trivy.yaml
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Docker container smoke test
        run: |
          docker run -d --rm -p 4000:4000 --name seedflix-test local/seedflix:ci
          for i in {1..25}; do
            if curl --silent --show-error --fail http://127.0.0.1:4000/api/health >/tmp/health.json; then
              break
            fi
            sleep 1
          done
          grep -q '"ok":true' /tmp/health.json
          docker stop seedflix-test
